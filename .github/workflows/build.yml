name: Build and test

on:
  push:
  pull_request:

jobs:
  core:
    name: ${{ matrix.os }} core build
    runs-on: ${{ matrix.os }}
    strategy:
      fail-fast: false
      matrix:
        os: [ubuntu-latest, windows-latest]

    steps:
      - uses: actions/checkout@v4

      - name: Configure
        run: >-
          cmake -S . -B build
          -DBUILD_TESTS=ON
          -DBUILD_QT_VIEWER=OFF
          -DCAD_USE_LIBREDWG_API=OFF

      - name: Build
        run: cmake --build build --config Debug --parallel

      - name: Test
        run: cmake -E chdir build ctest -C Debug --output-on-failure

  windows-full:
    name: Windows MSVC Qt5 and LibreDWG C API
    runs-on: windows-latest

    steps:
      - uses: actions/checkout@v4
        with:
          submodules: recursive

      - name: Set up MSVC
        uses: ilammy/msvc-dev-cmd@v1
        with:
          arch: x64

      - name: Install Qt 5
        uses: jurplel/install-qt-action@v4
        with:
          version: 5.15.2
          arch: win64_msvc2019_64
          # install-qt-action appends its own Qt directory below this root.
          dir: ${{ runner.temp }}
          set-env: true

      - name: Build, test, and deploy full Windows target
        shell: pwsh
        run: |
          $qtDir = $env:QT_ROOT_DIR
          if ([string]::IsNullOrWhiteSpace($qtDir)) {
            throw "install-qt-action did not set QT_ROOT_DIR."
          }
          $windeployqt = Join-Path $qtDir "bin/windeployqt.exe"
          if (-not (Test-Path -LiteralPath $windeployqt)) {
            throw "Qt installation '$qtDir' does not contain bin/windeployqt.exe."
          }
          .\scripts\build_windows.ps1 -BuildDir build-windows-full -Generator Ninja -Configuration Release -EnableQtViewer -QtDir $qtDir

      - name: Verify C API and deployed viewer
        shell: pwsh
        run: |
          $outputDir = Join-Path $env:GITHUB_WORKSPACE "build-windows-full"
          $cli = Join-Path $outputDir "cad-parser-cli.exe"
          $viewer = Join-Path $outputDir "cad-viewer.exe"
          $preview = Join-Path $outputDir "viewer-smoke.png"
          $drawing = Join-Path $env:GITHUB_WORKSPACE "demo/sample.dxf"
          & $cli "--check-dwg"
          if ($LASTEXITCODE -ne 0) { throw "LibreDWG C API check failed." }
          $viewerArgs = '"{0}" --screenshot "{1}"' -f $drawing, $preview
          $viewerProcess = Start-Process -FilePath $viewer -ArgumentList $viewerArgs -Wait -PassThru
          if ($viewerProcess.ExitCode -ne 0) { throw "Deployed Qt viewer smoke test failed." }
          if (-not (Test-Path -LiteralPath $preview)) { throw "Viewer screenshot was not created." }
          if ((Get-Item -LiteralPath $preview).Length -le 0) { throw "Viewer screenshot is empty." }
          if (-not (Test-Path -LiteralPath (Join-Path $outputDir "platforms/qwindows.dll"))) {
            throw "Qt Windows platform plugin was not deployed."
          }
